<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactformulier - Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 1.5rem; color: #333; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; font-weight: 600; color: #555; }
    input, textarea, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.2); }
    .error { border-color: #e74c3c !important; }
    .error-msg { color: #e74c3c; font-size: 0.85rem; margin-top: 0.25rem; display: none; }
    .error-msg.visible { display: block; }
    button { background: #0066cc; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #0052a3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .success { background: #d4edda; border: 1px solid #c3e6cb; padding: 1rem; border-radius: 4px; color: #155724; display: none; margin-top: 1rem; }
    .success.visible { display: block; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
    .checkbox-group input { width: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contactformulier</h1>
    <form id="contactForm" novalidate>
      <div class="form-group">
        <label for="naam">Naam *</label>
        <input type="text" id="naam" name="naam" required aria-required="true" placeholder="Uw volledige naam">
        <div class="error-msg" id="naamError">Vul uw naam in</div>
      </div>

      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" required aria-required="true" placeholder="uw@email.nl">
        <div class="error-msg" id="emailError">Vul een geldig e-mailadres in</div>
      </div>

      <div class="form-group">
        <label for="telefoon">Telefoonnummer</label>
        <input type="tel" id="telefoon" name="telefoon" placeholder="06-12345678">
      </div>

      <div class="form-group">
        <label for="onderwerp">Onderwerp *</label>
        <select id="onderwerp" name="onderwerp" required aria-required="true">
          <option value="">-- Kies een onderwerp --</option>
          <option value="vraag">Vraag</option>
          <option value="feedback">Feedback</option>
          <option value="samenwerking">Samenwerking</option>
          <option value="overig">Overig</option>
        </select>
        <div class="error-msg" id="onderwerpError">Kies een onderwerp</div>
      </div>

      <div class="form-group">
        <label for="bericht">Bericht *</label>
        <textarea id="bericht" name="bericht" rows="5" required aria-required="true" placeholder="Uw bericht..."></textarea>
        <div class="error-msg" id="berichtError">Vul een bericht in (minimaal 10 tekens)</div>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="privacy" name="privacy" required aria-required="true">
          <label for="privacy">Ik ga akkoord met het privacybeleid *</label>
        </div>
        <div class="error-msg" id="privacyError">U moet akkoord gaan met het privacybeleid</div>
      </div>

      <button type="submit" id="submitBtn">Verstuur</button>
    </form>

    <div class="success" id="successMsg">
      Bedankt! Uw bericht is succesvol verzonden. We nemen zo snel mogelijk contact met u op.
    </div>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const successMsg = document.getElementById('successMsg');

    function validateField(field, errorId, validationFn) {
      const error = document.getElementById(errorId);
      const isValid = validationFn(field.value);
      field.classList.toggle('error', !isValid);
      error.classList.toggle('visible', !isValid);
      return isValid;
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let isValid = true;

      isValid = validateField(
        document.getElementById('naam'), 'naamError',
        (v) => v.trim().length > 0
      ) && isValid;

      isValid = validateField(
        document.getElementById('email'), 'emailError',
        (v) => validateEmail(v)
      ) && isValid;

      isValid = validateField(
        document.getElementById('onderwerp'), 'onderwerpError',
        (v) => v !== ''
      ) && isValid;

      isValid = validateField(
        document.getElementById('bericht'), 'berichtError',
        (v) => v.trim().length >= 10
      ) && isValid;

      const privacy = document.getElementById('privacy');
      const privacyError = document.getElementById('privacyError');
      if (!privacy.checked) {
        privacyError.classList.add('visible');
        isValid = false;
      } else {
        privacyError.classList.remove('visible');
      }

      if (isValid) {
        form.style.display = 'none';
        successMsg.classList.add('visible');
      }
    });
  </script>
</body>
</html>
